<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact page for Fabrizio Caballero, a UX/UI designer, providing contact information and a form for inquiries">
    <meta name="author" content="Fabrizio Caballero">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/contact.css">
    <script src="../scripts/getdates.js" defer></script>
    <script src="scripts/contact.js" defer></script>
    <title>Contact Me</title>
</head>
<body>
    <header>
        <nav>
            <a href="home.html"><svg class="logo" xmlns="http://www.w3.org/2000/svg" width="225" height="148" viewBox="0 0 225 148">
                <path d="M0 131.283L128.433 1.06939e-06V33.434L30.143 131.283H0Z"/>
                <path d="M161 80.635L135.5 87.8463L110.31 61.6235L83.3741 87.8463L110.31 80.635L135.5 105.5L161 80.635Z"/>
                <path d="M136.45 1.31113L224.22 91.0286L194.719 91.0286L136.45 33.7719V1.31113Z"/>
            </svg></a>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact Me</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-container">
            <form>
                <fieldset>
                    <legend>Send me an email!</legend>
                    <div class="field">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="field">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="field">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button id="contact-button" class="primary-button" type="submit">Get in contact</button>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p><span id="currentYear"></span> Fabrizio Caballero, Paraguay</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
